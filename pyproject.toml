[project]
name = "demovid"
version = "0.1.0"
description = "CLI screen recorder for product demos: record raw + events, render zoom/cursor/PiP later"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "evdev>=1.7",
    "i3ipc>=2.2",
    "pywayland>=0.4.18",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "av>=13.0",
    "pillow>=12.3.0",
]

[project.urls]
Homepage = "https://github.com/yousefamar/demovid"
Issues = "https://github.com/yousefamar/demovid/issues"

[project.scripts]
demovid = "demovid.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["demovid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
